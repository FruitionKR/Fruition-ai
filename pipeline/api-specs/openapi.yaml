    ChatSourceBlockIn:
      description: 채팅 문답 1쌍. block_id는 `session_id:pair_id` provenance이고 text에는 그 id가 들어가지 않는다.
      properties:
        block_id:
          description: '`session_id:pair_id` 형식의 문답 provenance. source_blocks.block_id로 그대로 저장됩니다.'
          minLength: 1
          title: Block Id
          type: string
        text:
          description: 문답 본문. id를 포함하지 않습니다.
          minLength: 1
          title: Text
          type: string
      required:
      - block_id
      - text
      title: ChatSourceBlockIn
      type: object
    ChatWikiRunIn:
      additionalProperties: false
      properties:
        chat_system_prompt:
          default: prompts/chat_semantic_extraction.system.md
          title: Chat System Prompt
          type: string
        concept_page_mode:
          default: auto
          description: auto는 backend skeleton concept page만 생성합니다. section-polish를 명시하면 concept별 LLM polish를 수행합니다.
          enum:
          - auto
          - api
          - full-llm
          - skeleton
          - section-polish
          title: Concept Page Mode
          type: string
        concept_resolution_system_prompt:
          default: prompts/concept_resolution.system.md
          title: Concept Resolution System Prompt
          type: string
        concept_system_prompt:
          default: prompts/concept_page_generation.system.md
          title: Concept System Prompt
          type: string
        document_id:
          title: Document Id
          type: string
        existing_wiki_dir:
          anyOf:
          - type: string
          - type: 'null'
          title: Existing Wiki Dir
        input_blocks:
          description: 문답 단위 source block 목록입니다. 파이프라인은 Markdown을 다시 쪼개지 않고 이 목록을 그대로 씁니다.
          items:
            $ref: '#/components/schemas/ChatSourceBlockIn'
          minItems: 1
          title: Input Blocks
          type: array
        input_markdown:
          description: backend가 직렬화한 채팅 Markdown입니다. 문서 제목 추출에만 쓰이며 블록 분할에는 쓰지 않습니다.
          minLength: 1
          title: Input Markdown
          type: string
        input_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Name
        log_callback_url:
          anyOf:
          - type: string
          - type: 'null'
          description: 설정하면 pipeline.log 이벤트가 생길 때마다 이 URL로 JSON POST합니다.
          title: Log Callback Url
        max_eval_attempts:
          default: 2
          title: Max Eval Attempts
          type: integer
        max_packet_chars:
          default: 7000
          title: Max Packet Chars
          type: integer
        mode:
          default: api
          enum:
          - api
          - generic-chat
          title: Mode
          type: string
        model:
          title: Model
          type: string
        operation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Operation Id
        out:
          anyOf:
          - type: string
          - type: 'null'
          title: Out
        overlap_blocks:
          default: 1
          title: Overlap Blocks
          type: integer
        provider:
          enum:
          - openai
          - gemini
          - claude
          title: Provider
          type: string
        save_debug_json:
          default: false
          description: True이면 raw LLM output, packet, block_map 같은 디버그 JSON을 저장합니다.
          title: Save Debug Json
          type: boolean
        section_polish_system_prompt:
          default: prompts/section_polish.system.md
          title: Section Polish System Prompt
          type: string
        selection_mode:
          const: partial
          description: 채팅 Wiki export는 항상 독립 source page를 생성하므로 partial만 지원합니다.
          title: Selection Mode
          type: string
        source_content_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Content Hash
        source_page_mode:
          default: auto
          enum:
          - auto
          - skeleton
          - section-polish
          title: Source Page Mode
          type: string
        source_revision:
          anyOf:
          - type: integer
          - type: 'null'
          title: Source Revision
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 기존 backend 요청 호환 필드이며 Wiki 저장 범위에는 사용하지 않습니다.
          title: User Id
        wait:
          default: false
          description: True이면 요청 안에서 완료까지 기다립니다. False이면 백그라운드 실행 후 로그를 조회합니다.
          title: Wait
          type: boolean
        wiki_evaluation_loop:
          default: true
          title: Wiki Evaluation Loop
          type: boolean
        wiki_evaluator_system_prompt:
          default: prompts/wiki_generation_evaluator.system.md
          title: Wiki Evaluator System Prompt
          type: string
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 기존 backend 요청 호환 필드이며 Wiki 저장 범위에는 사용하지 않습니다.
          title: Workspace Id
      required:
      - document_id
      - provider
      - model
      - selection_mode
      - input_markdown
      - input_blocks
      title: ChatWikiRunIn
      type: object
