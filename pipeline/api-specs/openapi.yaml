          type: string
        edit_destination:
          anyOf:
          - enum:
            - target
            - document_end
            type: string
          - type: 'null'
          title: Edit Destination
        edit_goal:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Edit Goal
        edit_operation:
          anyOf:
          - enum:
            - replace
            - insert_after
            type: string
          - type: 'null'
          title: Edit Operation
        persist:
          title: Persist
          type: boolean
        retrieval_source:
          enum:
          - none
          - workspace
          - web
          title: Retrieval Source
          type: string
        selected_skill_id:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Selected Skill Id
      required:
      - action
      - retrieval_source
      - document_operation
      - persist
      title: ConversationAgentRouteRequest
      type: object
    ConversationMessageRequest:
