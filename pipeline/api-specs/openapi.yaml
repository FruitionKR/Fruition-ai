    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IngestOperationRestoreIn:
      properties:
        cancel_operation_ids:
          items:
            type: string
          title: Cancel Operation Ids
          type: array
        deleted_pages:
          items:
            type: string
          title: Deleted Pages
          type: array
        operation_id:
          title: Operation Id
          type: string
        rebuild_pages:
          items:
            $ref: '#/components/schemas/RebuildPageIn'
          title: Rebuild Pages
          type: array
        restore_to_operation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Restore To Operation Id
        source_page:
          $ref: '#/components/schemas/SourceSnapshotRestoreIn'
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - operation_id
      - workspace_id
      - rebuild_pages
      - restore_to_operation_id
      - cancel_operation_ids
      - source_page
      title: IngestOperationRestoreIn
      type: object
    LintOperationRestoreIn:
      properties:
        deleted_pages:
          items:
            type: string
          title: Deleted Pages
          type: array
        operation_id:
          title: Operation Id
          type: string
        rebuild_pages:
          items:
            $ref: '#/components/schemas/RebuildPageIn'
          title: Rebuild Pages
          type: array
        target_operation_id:
          title: Target Operation Id
          type: string
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - operation_id
      - workspace_id
      - rebuild_pages
      - target_operation_id
      title: LintOperationRestoreIn
      type: object
    ListWikiSchemaDraftsResponse:
      properties:
        wiki_schemas:
          items:
            $ref: '#/components/schemas/WikiSchemaResponse'
          title: Wiki Schemas
          type: array
      required:
      - wiki_schemas
      title: ListWikiSchemaDraftsResponse
      type: object
    MarkdownAgentRunStatusResponse:
      properties:
        apply_operation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Apply Operation Id
        base_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Base Version
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        id:
          title: Id
          type: string
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        status:
          title: Status
          type: string
      required:
      - id
      - status
      - result
      - error_code
      title: MarkdownAgentRunStatusResponse
      type: object
    ModelUsage:
      properties:
        calls:
          minimum: 0.0
          title: Calls
          type: integer
        failed_calls:
          minimum: 0.0
          title: Failed Calls
          type: integer
        known_cache_creation_tokens:
          minimum: 0.0
          title: Known Cache Creation Tokens
          type: integer
        known_cached_input_tokens:
          minimum: 0.0
          title: Known Cached Input Tokens
          type: integer
        known_input_tokens:
          minimum: 0.0
          title: Known Input Tokens
          type: integer
        known_output_tokens:
          minimum: 0.0
          title: Known Output Tokens
          type: integer
        known_reasoning_tokens:
          minimum: 0.0
          title: Known Reasoning Tokens
          type: integer
        model:
          title: Model
          type: string
        provider:
          title: Provider
          type: string
        requested_model:
          title: Requested Model
          type: string
        unfinished_calls:
          minimum: 0.0
          title: Unfinished Calls
          type: integer
        unknown_cache_usage_calls:
          minimum: 0.0
