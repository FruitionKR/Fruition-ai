      type: object
    ModelUsageCall:
      properties:
        audio_seconds:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Audio Seconds
        cache_creation_tokens:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Cache Creation Tokens
        cached_input_tokens:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Cached Input Tokens
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        id:
          format: uuid
          title: Id
          type: string
        input_characters:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Input Characters
        input_tokens:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Input Tokens
        kind:
          title: Kind
          type: string
        model:
          title: Model
          type: string
        output_tokens:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Output Tokens
        provider:
          title: Provider
          type: string
        reasoning_tokens:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Reasoning Tokens
        requested_model:
          title: Requested Model
          type: string
        run_id:
          title: Run Id
          type: string
        started_at:
          format: date-time
          title: Started At
          type: string
        status:
          enum:
          - started
          - succeeded
          - failed
          - abandoned
          - cancelled
          title: Status
          type: string
        user_id:
          title: User Id
          type: string
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - id
      - run_id
      - workspace_id
      - user_id
      - kind
      - provider
      - requested_model
