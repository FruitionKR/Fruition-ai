components:
  schemas:
    AgentArtifactListRequest:
      properties:
        run_id:
          minLength: 1
          title: Run Id
          type: string
        user_id:
          minLength: 1
          title: User Id
          type: string
        workspace_id:
          minLength: 1
          title: Workspace Id
          type: string
      required:
      - run_id
      - workspace_id
      - user_id
      title: AgentArtifactListRequest
      type: object
    AgentArtifactRegisterRequest:
      properties:
        artifact_id:
          minLength: 1
          title: Artifact Id
          type: string
        base_version:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Base Version
        content_hash:
          maxLength: 71
          minLength: 71
          title: Content Hash
          type: string
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        markdown:
          maxLength: 5242880
          minLength: 0
          title: Markdown
          type: string
        purpose:
          minLength: 1
          title: Purpose
          type: string
        run_id:
          minLength: 1
          title: Run Id
          type: string
        target:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Target
        user_id:
          minLength: 1
          title: User Id
          type: string
        workspace_id:
          minLength: 1
          title: Workspace Id
          type: string
      required:
      - run_id
      - workspace_id
      - user_id
      - artifact_id
      - content_hash
      - purpose
      - markdown
      title: AgentArtifactRegisterRequest
      type: object
    AgentArtifactResolveRequest:
      properties:
        artifact_id:
          minLength: 1
          title: Artifact Id
          type: string
        base_version:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Base Version
        content_hash:
          maxLength: 71
          minLength: 71
          title: Content Hash
          type: string
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        purpose:
          minLength: 1
          title: Purpose
          type: string
        run_id:
          minLength: 1
          title: Run Id
          type: string
        target:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Target
        user_id:
          minLength: 1
          title: User Id
          type: string
        workspace_id:
          minLength: 1
          title: Workspace Id
          type: string
      required:
      - run_id
      - workspace_id
      - user_id
      - artifact_id
      - content_hash
      - purpose
      title: AgentArtifactResolveRequest
      type: object
    AgentArtifactResolveResponse:
      properties:
        base_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Base Version
        content_hash:
          title: Content Hash
          type: string
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        id:
          title: Id
          type: string
        markdown:
          title: Markdown
          type: string
        purpose:
          title: Purpose
          type: string
        target:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Target
      required:
      - id
      - content_hash
      - purpose
      - markdown
      title: AgentArtifactResolveResponse
      type: object
    AgentArtifactResponse:
      properties:
        base_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Base Version
        content_hash:
          title: Content Hash
          type: string
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        id:
          title: Id
          type: string
        purpose:
          title: Purpose
          type: string
        target:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Target
      required:
      - id
      - content_hash
      - purpose
      title: AgentArtifactResponse
      type: object
    AgentPlanOperationResponse:
      properties:
        arguments:
          additionalProperties: true
          title: Arguments
          type: object
        base_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Base Version
        depends_on:
          items:
            type: string
          title: Depends On
          type: array
        destination_parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Parent Id
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        id:
          title: Id
          type: string
        reason:
          title: Reason
          type: string
        sequence:
          title: Sequence
          type: integer
        source_parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Parent Id
        status:
          title: Status
          type: string
        suggested_selected:
          default: true
          title: Suggested Selected
          type: boolean
        target_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
        target_type:
          title: Target Type
          type: string
        tool_name:
          title: Tool Name
          type: string
        warning:
          anyOf:
          - $ref: '#/components/schemas/AgentPlanOperationWarningResponse'
          - type: 'null'
      required:
      - id
      - sequence
      - tool_name
      - target_type
      - target_id
      - base_version
      - source_parent_id
      - destination_parent_id
      - arguments
      - reason
      - depends_on
      - status
      - error_code
      title: AgentPlanOperationResponse
      type: object
    AgentPlanOperationWarningResponse:
      properties:
        message:
          title: Message
          type: string
        type:
          description: duplicate_name(같은 위치에 같은 이름), duplicate_content(본문이 거의 같은 문서) 또는 depends_on_unselected
          title: Type
          type: string
      required:
      - type
      - message
      title: AgentPlanOperationWarningResponse
      type: object
    AgentPlanResponse:
      properties:
        id:
          title: Id
          type: string
        operation_hash:
          title: Operation Hash
          type: string
        operations:
          items:
            $ref: '#/components/schemas/AgentPlanOperationResponse'
          title: Operations
          type: array
        status:
          title: Status
          type: string
        summary:
          title: Summary
          type: string
        version:
          title: Version
          type: integer
      required:
      - id
      - version
      - summary
      - operation_hash
      - status
      - operations
      title: AgentPlanResponse
      type: object
    AgentRunActorRequest:
      properties:
        user_id:
          minLength: 1
          title: User Id
          type: string
        workspace_id:
          minLength: 1
          title: Workspace Id
          type: string
      required:
      - workspace_id
      - user_id
      title: AgentRunActorRequest
      type: object
    AgentRunResponse:
      properties:
        action:
          title: Action
          type: string
        clarification_question:
          anyOf:
          - type: string
          - type: 'null'
          title: Clarification Question
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        id:
          title: Id
          type: string
        plan:
          anyOf:
          - $ref: '#/components/schemas/AgentPlanResponse'
          - type: 'null'
        request_summary:
          title: Request Summary
          type: string
        rule_summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Rule Summary
        skill_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Skill Version Id
        status:
          title: Status
          type: string
        target_folder_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Folder Id
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - id
      - workspace_id
      - action
      - skill_version_id
      - status
      - request_summary
      - error_code
      title: AgentRunResponse
      type: object
    AgentToolExecuteAuthorizationRequest:
      properties:
        arguments:
          additionalProperties: true
          title: Arguments
          type: object
        operation_hash:
          maxLength: 64
          minLength: 64
          title: Operation Hash
          type: string
        operation_id:
          minLength: 1
          title: Operation Id
          type: string
        plan_id:
          minLength: 1
          title: Plan Id
          type: string
        plan_version:
          minimum: 1.0
          title: Plan Version
          type: integer
        run_id:
          minLength: 1
          title: Run Id
          type: string
        tool_name:
          minLength: 1
          title: Tool Name
          type: string
        user_id:
          minLength: 1
          title: User Id
          type: string
        workspace_id:
          minLength: 1
          title: Workspace Id
          type: string
      required:
      - workspace_id
      - user_id
      - run_id
      - plan_id
      - plan_version
      - operation_hash
      - operation_id
      - tool_name
      - arguments
      title: AgentToolExecuteAuthorizationRequest
      type: object
    AgentToolReadAuthorizationRequest:
      properties:
        run_id:
          minLength: 1
          title: Run Id
          type: string
        user_id:
          minLength: 1
          title: User Id
          type: string
        workspace_id:
          minLength: 1
          title: Workspace Id
          type: string
      required:
      - workspace_id
      - user_id
      - run_id
      title: AgentToolReadAuthorizationRequest
      type: object
    ApproveAgentPlanRequest:
      properties:
        operation_hash:
          maxLength: 64
          minLength: 64
          title: Operation Hash
          type: string
        operation_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 실행할 작업(plan.operations[].id) 1~20개. 생략하면 계획 전체를 실행한다. 고르지 않은 작업은 skipped(error_code=not_selected)가 된다. 빈 배열·20개 초과·중복·계획에 없는 ID·의존 작업 누락은 400으로 거절한다.
          title: Operation Ids
        plan_version:
          minimum: 1.0
          title: Plan Version
          type: integer
        user_id:
          minLength: 1
          title: User Id
          type: string
        workspace_id:
          minLength: 1
          title: Workspace Id
          type: string
      required:
      - workspace_id
      - user_id
      - plan_version
      - operation_hash
      title: ApproveAgentPlanRequest
      type: object
    CancelTaskRequest:
      additionalProperties: false
      properties:
        command:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Command
        user_id:
          minLength: 1
          title: User Id
          type: string
        workspace_id:
          minLength: 1
          title: Workspace Id
          type: string
      required:
      - workspace_id
      - user_id
      title: CancelTaskRequest
      type: object
    ChatSourceBlockIn:
      description: 채팅 문답 1쌍. block_id는 `session_id:pair_id` provenance이고 text에는 그 id가 들어가지 않는다.
      properties:
        block_id:
          description: '`session_id:pair_id` 형식의 문답 provenance. source_blocks.block_id로 그대로 저장됩니다.'
          minLength: 1
          title: Block Id
          type: string
        text:
          description: 문답 본문. id를 포함하지 않습니다.
          minLength: 1
          title: Text
          type: string
      required:
      - block_id
      - text
      title: ChatSourceBlockIn
      type: object
    ChatWikiRunIn:
      additionalProperties: false
      properties:
        chat_system_prompt:
          default: prompts/chat_semantic_extraction.system.md
          title: Chat System Prompt
          type: string
        concept_page_mode:
          default: auto
          description: auto/skeleton은 backend skeleton concept page를 생성합니다.
          enum:
          - auto
          - api
          - full-llm
          - skeleton
          title: Concept Page Mode
          type: string
        concept_resolution_system_prompt:
          default: prompts/concept_resolution.system.md
          title: Concept Resolution System Prompt
          type: string
        concept_system_prompt:
          default: prompts/concept_page_generation.system.md
          title: Concept System Prompt
          type: string
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          description: 소스 페이지 제목으로 저장할 문서 이름입니다. 없으면 문서 파일명에서 확장자를 뗀 이름을 씁니다. 채팅 Wiki export에는 쓰지 않습니다.
          title: Display Name
        document_id:
          title: Document Id
          type: string
        existing_wiki_dir:
          anyOf:
          - type: string
          - type: 'null'
          title: Existing Wiki Dir
        input_blocks:
          description: 문답 단위 source block 목록입니다. 파이프라인은 Markdown을 다시 쪼개지 않고 이 목록을 그대로 씁니다.
          items:
            $ref: '#/components/schemas/ChatSourceBlockIn'
          minItems: 1
          title: Input Blocks
          type: array
        input_markdown:
          description: backend가 직렬화한 채팅 Markdown입니다. 문서 제목 추출에만 쓰이며 블록 분할에는 쓰지 않습니다.
          minLength: 1
          title: Input Markdown
          type: string
        input_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Name
        log_callback_url:
          anyOf:
          - type: string
          - type: 'null'
          description: 설정하면 pipeline.log 이벤트가 생길 때마다 이 URL로 JSON POST합니다.
          title: Log Callback Url
        max_eval_attempts:
          default: 2
          title: Max Eval Attempts
          type: integer
        max_packet_chars:
          default: 7000
          title: Max Packet Chars
          type: integer
        mode:
          default: api
          enum:
          - api
          - generic-chat
          title: Mode
          type: string
        model:
          title: Model
          type: string
        operation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Operation Id
        overlap_blocks:
          default: 1
          title: Overlap Blocks
          type: integer
        provider:
          enum:
          - openai
          - gemini
          - claude
          title: Provider
          type: string
        save_debug_json:
          default: false
          description: True이면 raw LLM output, packet, block_map 같은 디버그 JSON을 저장합니다.
          title: Save Debug Json
          type: boolean
        selection_mode:
          const: partial
          description: 채팅 Wiki export는 항상 독립 source page를 생성하므로 partial만 지원합니다.
          title: Selection Mode
          type: string
        source_content_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Content Hash
        source_page_mode:
          default: auto
          enum:
          - auto
          - skeleton
          title: Source Page Mode
          type: string
        source_revision:
          anyOf:
          - type: integer
          - type: 'null'
          title: Source Revision
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 편입을 요청한 사용자입니다. 귀속 정보로만 저장하며 Wiki 저장 범위에는 사용하지 않습니다. 없으면 문서 소유자로 기록합니다.
          title: User Id
        wait:
          default: false
          description: True이면 요청 안에서 완료까지 기다립니다. False이면 백그라운드 실행 후 로그를 조회합니다.
          title: Wait
          type: boolean
        wiki_evaluation_loop:
          default: true
          title: Wiki Evaluation Loop
          type: boolean
        wiki_evaluator_system_prompt:
          default: prompts/wiki_generation_evaluator.system.md
          title: Wiki Evaluator System Prompt
          type: string
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 기존 backend 요청 호환 필드이며 Wiki 저장 범위에는 사용하지 않습니다.
          title: Workspace Id
      required:
      - document_id
      - provider
      - model
      - selection_mode
      - input_markdown
      - input_blocks
      title: ChatWikiRunIn
      type: object
    CreateWikiSchemaDraftRequest:
      properties:
        model:
          minLength: 1
          title: Model
          type: string
        name:
          default: default
          minLength: 1
          title: Name
          type: string
        provider:
          minLength: 1
          title: Provider
          type: string
        raw_markdown:
          minLength: 1
          title: Raw Markdown
          type: string
        user_id:
          minLength: 1
          title: User Id
          type: string
        workspace_id:
          minLength: 1
          title: Workspace Id
          type: string
      required:
      - raw_markdown
      - provider
      - model
      - workspace_id
      - user_id
      title: CreateWikiSchemaDraftRequest
      type: object
    CreateWikiSchemaDraftResponse:
      properties:
        wiki_schema:
