name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  pipeline:
    name: llmPipeline (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated_ci_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ANALYTICS_TEST_DSN: postgresql://postgres:isolated_ci_test_password@localhost:5432/postgres
      CONCEPT_LOCK_TEST_DSN: postgresql://postgres:isolated_ci_test_password@localhost:5432/postgres
      # DB 테스트(task journal·agent rollback·purge 등)는 테스트마다 격리 스키마를 만들어 같은 서비스 DB를 쓴다.
      TEST_AGENT_DATABASE_URL: postgresql://postgres:isolated_ci_test_password@localhost:5432/postgres
      # MCP 위키 초안 DB 테스트(test_mcp_wiki_draft.py 등)는 스키마를 적용한 별도 ai DB를 쓴다. 아래 단계가 만든다.
      AI_DATABASE_URL: postgresql://postgres:isolated_ci_test_password@localhost:5432/ai
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: fruition
      S3_SECRET_KEY: fruition_dev_secret
      S3_BUCKET: fruition-storage
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MinIO
        working-directory: .
        run: |
          docker run --detach --name pipeline-ci-minio \
            --env MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            --publish 9000:9000 \
            cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b \
            server /data
          for attempt in {1..30}; do
            curl --fail --silent "$S3_ENDPOINT/minio/health/ready" && exit 0
            sleep 1
          done
          docker logs pipeline-ci-minio
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prepare ai_db schema
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["TEST_AGENT_DATABASE_URL"], autocommit=True) as conn:
              conn.execute("CREATE DATABASE ai")
          with psycopg.connect(os.environ["AI_DATABASE_URL"]) as conn:
              conn.execute(open("db/ai_schema.sql", encoding="utf-8").read())
          PY

      - name: Run tests
        run: pytest -q

      # converter 이미지의 Range 기반 PDF 배치 API는 pypdf만 추가로 필요하다. 무거운 OCR 의존성은 mock이다.
      - name: Run converter tests
        working-directory: .
        run: |
          pip install "pypdf>=6.13,<7" python-multipart
          pytest -q converter/test_app.py converter/test_worker.py

      # converter 이미지 의존성을 linux/amd64 기준으로 dry-run 해석해 +cpu torch만 선택되고
      # nvidia/cuda/triton 패키지가 끼어들지 않는지 확인한다. 실제 설치·이미지 빌드는 하지 않는다.
      - name: Verify converter resolves CPU-only torch
        working-directory: .
        run: |
          pip install --dry-run --ignore-installed --only-binary=:all: \
            --target /tmp/converter-dry-run --report /tmp/converter-report.json \
            -r converter/requirements.txt
          python converter/check_cpu_only.py --report /tmp/converter-report.json
