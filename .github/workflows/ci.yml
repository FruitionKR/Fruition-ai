name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  pipeline:
    name: llmPipeline (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated_ci_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CONCEPT_LOCK_TEST_DSN: postgresql://postgres:isolated_ci_test_password@localhost:5432/postgres
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # document_restoration은 PyMuPDF 등 무거운 의존성이 필요해 별도 requirements를 쓴다.
      # 기본 실행에서는 제외하고, 필요해지면 requirements-document-restoration.txt를 설치해 붙인다.
      - name: Run tests
        run: pytest -q --ignore=tests/modules/document_restoration
